name: Tic-Tac-Toe

on:
  issues:
    types: [opened]

# One move at a time so two players can't overwrite each other's board.
concurrency:
  group: tic-tac-toe
  cancel-in-progress: false

jobs:
  play:
    if: startsWith(github.event.issue.title, 'ttt|')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Issue title/user are untrusted input: pass them via env, never inline.
      - name: Play move
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
        run: node game/play.js > "$RUNNER_TEMP/message.md"

      - name: Commit board
        env:
          ISSUE_USER: ${{ github.event.issue.user.login }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md game/state.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Tic-tac-toe move by $ISSUE_USER"
          git push

      - name: Reply and close issue
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
        run: gh issue close "$NUM" --repo "$GITHUB_REPOSITORY" --comment "$(cat "$RUNNER_TEMP/message.md")"
